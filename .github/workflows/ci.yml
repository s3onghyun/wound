name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Show selected Xcode
        run: xcodebuild -version
      - name: Build release executable
        run: swift build -c release --product Wound
      - name: Run movement checks
        run: swift test
