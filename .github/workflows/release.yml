name: Release

# Two phases, so a notarization that takes Apple hours never throws away the signed app (.github/RELEASING.md).
#   Phase 1 - a v* tag push, or a manual run with tag (rebuild an existing tag):
#     movement checks -> universal app -> Developer ID signature -> notarization submit (no wait) -> keep the
#     signed zip, its .sha256 and the submission id as an artifact for 90 days. Publishes nothing.
#   Phase 2 - a manual run with run_id (the phase-1 run):
#     download that artifact; if Apple has accepted it, staple the same app, verify it, and publish the GitHub
#     Release. While Apple is still working it changes nothing and fails, to be run again later.
#   Dry run - a manual run with no inputs: phase 1 only, named after the branch, artifact kept 7 days.
#     Phase 2 with its run_id staples and verifies but publishes nothing.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Phase 2: run id of the phase-1 run to publish (gh run list -R s3onghyun/wound -w release.yml)'
        type: string
        default: ''
      submission_id:
        description: 'Phase 2, optional: a notarization submission id instead of the one in the phase-1 artifact'
        type: string
        default: ''
      tag:
        description: 'Rebuild phase 1 for an existing tag (for example v0.1.2). Not used with run_id'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  # Phase 1: build, sign, submit for notarization
  sign-and-submit:
    if: github.event_name == 'push' || inputs.run_id == ''
    runs-on: macos-15
    timeout-minutes: 60
    env:
      # Secrets cannot be used in if:, so pass only whether one is set (true/false, never the value).
      HAS_SIGNING: ${{ secrets.APPLE_DEVELOPER_ID_P12 != '' }}
    steps:
      # Inputs reach the shell only through the environment and are format-checked.
      - name: Release version
        id: version
        env:
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          if [[ "$HAS_SIGNING" != true ]]; then
            echo "No Developer ID signing secret (APPLE_DEVELOPER_ID_P12). Wound is not released without notarization (.github/RELEASING.md)" >&2
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then tag="$GITHUB_REF_NAME"; else tag="$TAG_INPUT"; fi
          if [[ -n "$tag" ]]; then
            [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "The tag must be vX.Y.Z" >&2; exit 1; }
            version="${tag#v}" ref="refs/tags/$tag" retention=90
          else
            version="${GITHUB_REF_NAME//\//-}" ref="$GITHUB_SHA" retention=7
            [[ "$version" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$ ]] || { echo "The branch name cannot name a dry-run build" >&2; exit 1; }
          fi
          { echo "tag=$tag"; echo "version=$version"; echo "ref=$ref"; echo "retention=$retention"; } >> "$GITHUB_OUTPUT"
          echo "Version $version (tag ${tag:-none, dry run}), source $ref"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ steps.version.outputs.ref }}
          persist-credentials: false
      # Always notarize with this workflow's script; an older tag carries none.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          sparse-checkout: scripts/notarize-app.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Show selected Xcode
        run: xcodebuild -version
      - name: Check tag and version
        if: steps.version.outputs.tag != ''
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: test "$TAG" = "v$(tr -d '\r\n' < VERSION)"
      - name: Run movement checks
        run: swift test
      - name: Build universal app
        run: |
          ARCHS=universal ./scripts/bundle.sh
          lipo -archs build/Wound.app/Contents/MacOS/Wound
      - name: Sign with Developer ID and submit for notarization
        timeout-minutes: 30
        env:
          RELEASE_ROOT: ${{ github.workspace }}
          VERSION: ${{ steps.version.outputs.version }}
          APPLE_DEVELOPER_ID_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: .release-tools/scripts/notarize-app.sh submit
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wound-signed-${{ steps.version.outputs.version }}
          path: dist/notary/
          if-no-files-found: error
          retention-days: ${{ fromJSON(steps.version.outputs.retention) }}
      - name: Phase 2 command
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          id="$(plutil -extract id raw -o - dist/notary/submission.json)"
          sha="$(plutil -extract sha256 raw -o - dist/notary/submission.json)"
          # A dry run's phase 2 lives in the branch's workflow; a release's in the default branch's.
          ref="$DEFAULT_BRANCH"; [[ -n "$TAG" ]] || ref="$GITHUB_REF_NAME"
          cmd="gh workflow run release.yml -R $GITHUB_REPOSITORY --ref $ref -f run_id=$GITHUB_RUN_ID"
          echo "Phase 2, once Apple has accepted: $cmd"
          {
            echo "### Notarization submitted - nothing published yet"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Submission id | \`$id\` |"
            echo "| Signed zip sha256 | \`$sha\` |"
            echo "| Phase-1 run id | \`$GITHUB_RUN_ID\` |"
            echo
            echo "Once Apple has accepted, run phase 2 (while Apple is still working it changes nothing and fails; run it again later):"
            echo
            echo '```sh'
            echo "$cmd"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Phase 2: check notarization and staple
  notarized:
    if: github.event_name == 'workflow_dispatch' && inputs.run_id != ''
    runs-on: macos-15
    timeout-minutes: 20
    concurrency:
      group: release-phase2-${{ inputs.run_id }}
    permissions:
      contents: read
      actions: read        # list and download the phase-1 run's artifacts
    outputs:
      version: ${{ steps.phase1.outputs.version }}
      publish: ${{ steps.phase1.outputs.publish }}
      commit: ${{ steps.submission.outputs.commit }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Find the phase-1 artifact
        id: phase1
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          SUBMISSION_INPUT: ${{ inputs.submission_id }}
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          fail() { echo "$*" >&2; exit 1; }
          [[ -z "$TAG_INPUT" ]] || fail "Use tag with phase 1 and run_id with phase 2, not both"
          [[ "$RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]] || fail "run_id must be a number"
          [[ -z "$SUBMISSION_INPUT" || "$SUBMISSION_INPUT" =~ ^[0-9A-Fa-f]{8}-([0-9A-Fa-f]{4}-){3}[0-9A-Fa-f]{12}$ ]] \
            || fail "submission_id must be a UUID"
          workflow="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq .path)"
          [[ "$workflow" == .github/workflows/release.yml ]] || fail "Run $RUN_ID is not a release.yml run"
          names="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" --paginate \
            --jq '.artifacts[] | select(.expired | not) | .name')"
          signed="$(grep -E '^wound-signed-[A-Za-z0-9][A-Za-z0-9._-]*$' <<< "$names" || true)"
          [[ -n "$signed" && "$(wc -l <<< "$signed")" -eq 1 ]] \
            || fail "Run $RUN_ID needs exactly one wound-signed-* artifact (expired, or phase 1 did not finish)"
          version="${signed#wound-signed-}"
          publish=false
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] && publish=true
          { echo "signed=$signed"; echo "version=$version"; echo "publish=$publish"; } >> "$GITHUB_OUTPUT"
          echo "Phase-1 run $RUN_ID: $signed (publish $publish)"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ steps.phase1.outputs.signed }}
          path: dist/notary
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Read the submission
        id: submission
        env:
          VERSION: ${{ steps.phase1.outputs.version }}
        run: |
          [[ "$(plutil -extract version raw -o - dist/notary/submission.json)" == "$VERSION" ]] \
            || { echo "submission.json names another version than the artifact" >&2; exit 1; }
          commit="$(plutil -extract commit raw -o - dist/notary/submission.json)"
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]] || commit=""
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - name: Staple once Apple has accepted
        env:
          SUBMISSION_INPUT: ${{ inputs.submission_id }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          rc=0
          ./scripts/notarize-app.sh finish ${SUBMISSION_INPUT:+"$SUBMISSION_INPUT"} || rc=$?
          if ((rc == 75)); then
            msg="Notarization is still in progress. Nothing was published; run phase 2 again later"
            echo "::error title=Notarization still in progress::$msg"
            echo "### $msg" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$rc"
      - name: Verify
        run: |
          codesign --verify --strict --verbose=2 build/Wound.app
          lipo -archs build/Wound.app/Contents/MacOS/Wound
          xcrun stapler validate build/Wound.app
          spctl --assess --type execute --verbose=2 build/Wound.app
          cd dist && shasum -a 256 -c ./*.sha256
      # A dry run's phase 2 keeps the stapled zip for 7 days and publishes nothing.
      - name: Keep the dry-run build
        if: steps.phase1.outputs.publish != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wound-dry-run
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 7
      - if: steps.phase1.outputs.publish == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wound-notarized-${{ steps.phase1.outputs.version }}
          path: |
            dist/Wound-${{ steps.phase1.outputs.version }}-macos-universal.zip
            dist/Wound-${{ steps.phase1.outputs.version }}-macos-universal.zip.sha256
          if-no-files-found: error
          retention-days: 7

  # Phase 2: GitHub Release. Only this job can write contents, and it gets no Apple secrets.
  publish:
    needs: notarized
    if: needs.notarized.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write      # create the Release
    env:
      VERSION: ${{ needs.notarized.outputs.version }}
      COMMIT: ${{ needs.notarized.outputs.commit }}
    steps:
      # Release notes, demo videos and screenshots come from the tagged commit.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/tags/v${{ needs.notarized.outputs.version }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wound-notarized-${{ needs.notarized.outputs.version }}
          path: dist
      - name: Check the assets
        run: |
          # Phase 1 must have built the commit the tag points at now.
          tagged="$(git rev-parse HEAD)"
          [[ -n "$COMMIT" && "$tagged" == "$COMMIT" ]] \
            || { echo "Tag v$VERSION is at $tagged, but phase 1 built ${COMMIT:-an unknown commit}" >&2; exit 1; }
          test "$VERSION" = "$(tr -d '\r\n' < VERSION)"
          cd dist && sha256sum -c "Wound-$VERSION-macos-universal.zip.sha256" && ls -l
      - name: Extract release notes
        run: |
          { sed "s/@VERSION@/$VERSION/g" .github/release-header.md; ./scripts/changelog-notes.sh "$VERSION"; } > release-notes.md
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$VERSION"
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Wound $tag" \
            --notes-file release-notes.md \
            --verify-tag \
            dist/*.zip dist/*.sha256 demo/wound-demo.mp4 demo/wound-explain.mp4 screenshots/explain-*.png
          echo "### Published $tag" >> "$GITHUB_STEP_SUMMARY"
